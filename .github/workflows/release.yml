# Builds the single-file distribution (mesh.cjs, runs on any OS with Node.js) and publishes it
# together with the installer scripts.
#   git tag v1.0.0 && git push --tags
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mesh
          path: dist/mesh.cjs*

  smoke:            # the same file must work with the oldest and newest supported Node.js on every OS
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - uses: actions/download-artifact@v4
        with: { name: mesh }
      - run: node mesh.cjs --version
      - run: node mesh.cjs help

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mesh, path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mesh.cjs
            artifacts/mesh.cjs.sha256
            scripts/install.sh
            scripts/install.ps1
