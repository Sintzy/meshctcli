# Builds the standalone executables on each platform and publishes them as a GitHub release.
#   git tag v1.0.0 && git push --tags
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        test: true }   # darwin arm64
          - { os: macos-15-intel,  test: true }   # darwin x64
          - { os: ubuntu-24.04,    test: true }   # linux x64
          - { os: ubuntu-24.04-arm, test: true }  # linux arm64
          - { os: windows-latest,  test: false }  # win x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - if: matrix.test
        run: npm test
      - run: npm run build
      - run: ./dist/mesh-* --version
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/mesh-*
            !dist/mesh.cjs

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            scripts/install.sh
            scripts/install.ps1
